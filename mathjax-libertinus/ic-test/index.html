<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>Libertinus f IC Tuning</title>
<style>
body { font-family: sans-serif; max-width: 1200px; margin: 1em auto; font-size: 14px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cell { border: 1px solid #ddd; border-radius: 6px; padding: 12px; }
.cell h3 { margin: 0 0 8px 0; font-size: 1em; color: #444; }
.cell iframe { width: 100%; height: 320px; border: none; }
</style>
</head><body>
<h1>Libertinus f( spacing — IC tuning</h1>
<p>ic controls space after italic f before upright characters like (.
Current ic=0.168 barely clears the overhang. Higher = more space.</p>

<div class="grid" id="grid"></div>

<script>
var ics = [
  {val: 'IC=0.168 (current)', file: 'bundle-ic-0_168.js'},
  {val: 'IC=0.20', file: 'bundle-ic-0_20.js'},
  {val: 'IC=0.22', file: 'bundle-ic-0_22.js'},
  {val: 'IC=0.25', file: 'bundle-ic-0_25.js'},
  {val: 'IC=0.28', file: 'bundle-ic-0_28.js'},
];

var math = [
  '<div style="font-size:1.6em; line-height:2.2;">',
  '<p>\\(f(x)\\) &ensp; \\(f(z)\\) &ensp; \\(f(\\theta)\\) &ensp; \\(g(x)\\)</p>',
  '<p>\\(f(x) = x^2 + 1\\) &ensp; \\(f(z) = e^z\\)</p>',
  '<p>\\(|G|\\) &ensp; \\(f \\circ g\\) &ensp; \\(f\'(x)\\)</p>',
  '<p style="font-size:1.4em">\\(\\int_a^b f(x)\\,dx\\) &ensp; \\(\\hat{f}(\\xi)\\)</p>',
  '</div>',
].join('\n');

var grid = document.getElementById('grid');
ics.forEach(function(ic) {
  var cell = document.createElement('div');
  cell.className = 'cell';
  cell.innerHTML = '<h3>' + ic.val + '</h3>';
  var iframe = document.createElement('iframe');
  cell.appendChild(iframe);
  grid.appendChild(cell);
  setTimeout(function() {
    var doc = iframe.contentDocument;
    doc.open();
    doc.write('<!DOCTYPE html><html><head><meta charset="utf-8">');
    doc.write('<script>MathJax={options:{enableExplorer:false,enableComplexity:false,enableEnrichment:false}};<\/script>');
    doc.write('<script id="MathJax-script" async src="' + ic.file + '"><\/script>');
    doc.write('</head><body style="margin:8px;">');
    doc.write(math);
    doc.write('</body></html>');
    doc.close();
  }, 100);
});
</script>
</body></html>
