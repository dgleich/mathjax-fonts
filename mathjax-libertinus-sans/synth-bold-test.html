const GLYPH_LABELS = {a:'a', e:'e', f:'f', g:'g', l:'l', kappa:'κ', kappa_var:'ϰ'};
const V = 35, H = 5;
const SKEW_ANGLE = 12 * Math.PI / 180;

function parseContours(ops) {
  const contours = []; let cur = null;
  for (const op of ops) {
    if (op[0]==='M') { cur=[{type:'on',x:op[1],y:op[2]}]; contours.push(cur); }
    else if (op[0]==='L') cur.push({type:'on',x:op[1],y:op[2]});
    else if (op[0]==='C') { cur.push({type:'off',x:op[1],y:op[2]}); cur.push({type:'off',x:op[3],y:op[4]}); cur.push({type:'on',x:op[5],y:op[6]}); }
    else if (op[0]==='Q') { cur.push({type:'off',x:op[1],y:op[2]}); cur.push({type:'on',x:op[3],y:op[4]}); }
  }
  return contours;
}

function vecLen(x,y){return Math.sqrt(x*x+y*y)}
function vecNorm(x,y){const l=vecLen(x,y);return l>0.001?[x/l,y/l]:[0,0]}

function getTangents(contour, idx) {
  const n=contour.length, pt=contour[idx];
  let inTan=[0,0], outTan=[0,0];
  for(let i=1;i<n;i++){const p=contour[(idx-i+n)%n];const dx=pt.x-p.x,dy=pt.y-p.y;if(vecLen(dx,dy)>0.1){inTan=vecNorm(dx,dy);break}}
  for(let i=1;i<n;i++){const p=contour[(idx+i)%n];const dx=p.x-pt.x,dy=p.y-pt.y;if(vecLen(dx,dy)>0.1){outTan=vecNorm(dx,dy);break}}
  return {inTan,outTan};
}
function outwardNormal(t){return[t[1],-t[0]]}
function anisoOffset(n){return[n[0]*V,n[1]*H]}

function averagedOffset(inT,outT){
  const nI=outwardNormal(inT),nO=outwardNormal(outT);
  let ax=nI[0]+nO[0],ay=nI[1]+nO[1];const l=vecLen(ax,ay);
  if(l>0.001){ax/=l;ay/=l}return anisoOffset([ax,ay]);
}
function miterOffset(inT,outT){
  const nI=outwardNormal(inT),nO=outwardNormal(outT);
  const oI=anisoOffset(nI),oO=anisoOffset(nO);
  const a=inT[0],b=outT[0],c=inT[1],d=outT[1];const det=a*d-b*c;
  if(Math.abs(det)<0.001)return null;
  const rx=oO[0]-oI[0],ry=oO[1]-oI[1];const t=(rx*d-ry*b)/det;
  return[oI[0]+t*inT[0],oI[1]+t*inT[1]];
}
function adaptiveOffset(inT,outT){
  const avg=averagedOffset(inT,outT);const mit=miterOffset(inT,outT);
  if(!mit)return avg;
  const aL=vecLen(avg[0],avg[1]),mL=vecLen(mit[0],mit[1]);
  if(aL<0.001)return avg;
  const ratio=mL/aL;const LO=1.5,HI=3.0;
  let t=Math.max(0,Math.min(1,(ratio-LO)/(HI-LO)));t=t*t*(3-2*t);
  return[mit[0]*(1-t)+avg[0]*t,mit[1]*(1-t)+avg[1]*t];
}

function emboldenContour(contour,method){
  const offsets=[],onIdx=[];
  for(let i=0;i<contour.length;i++){
    if(contour[i].type==='on'){
      onIdx.push(i);const{inTan,outTan}=getTangents(contour,i);
      let off;
      if(method==='averaged')off=averagedOffset(inTan,outTan);
      else if(method==='miter')off=miterOffset(inTan,outTan)||averagedOffset(inTan,outTan);
      else off=adaptiveOffset(inTan,outTan);
      offsets.push(off);
    }
  }
  const result=[];let oi=-1;
  for(let i=0;i<contour.length;i++){
    const pt=contour[i];
    if(pt.type==='on'){oi++;result.push({type:'on',x:pt.x+offsets[oi][0],y:pt.y+offsets[oi][1]});}
    else{
      let pO=-1,nO=-1;
      for(let j=i-1;j>=0;j--)if(contour[j].type==='on'){pO=onIdx.indexOf(j);break}
      for(let j=i+1;j<contour.length;j++)if(contour[j].type==='on'){nO=onIdx.indexOf(j);break}
      if(pO<0)pO=offsets.length-1;if(nO<0)nO=0;
      let isC1=true;
      for(let j=i-1;j>=0;j--){if(contour[j].type==='on'){isC1=true;break}if(contour[j].type==='off'){isC1=false;break}}
      const off=isC1?offsets[pO]:offsets[nO];
      result.push({type:'off',x:pt.x+off[0],y:pt.y+off[1]});
    }
  }
  return result;
}

function contoursToPath(contours){
  let d='';
  for(const c of contours){let i=0;while(i<c.length){
    const pt=c[i];
    if(i===0){d+=`M${pt.x.toFixed(1)} ${pt.y.toFixed(1)}`;i++}
    else if(pt.type==='on'){d+=`L${pt.x.toFixed(1)} ${pt.y.toFixed(1)}`;i++}
    else if(pt.type==='off'&&i+2<c.length){const c1=c[i],c2=c[i+1],ep=c[i+2];d+=`C${c1.x.toFixed(1)} ${c1.y.toFixed(1)} ${c2.x.toFixed(1)} ${c2.y.toFixed(1)} ${ep.x.toFixed(1)} ${ep.y.toFixed(1)}`;i+=3}
    else i++;
  }d+='Z'}return d;
}

function skewPath(ops){
  const t=Math.tan(SKEW_ANGLE);
  return ops.map(op=>{if(op[0]==='Z')return op;const r=[op[0]];for(let i=1;i<op.length;i+=2)r.push(op[i]+op[i+1]*t,op[i+1]);return r});
}
function opsToSvgPath(ops){
  let d='';for(const op of ops){
    if(op[0]==='M')d+=`M${op[1]} ${op[2]}`;else if(op[0]==='L')d+=`L${op[1]} ${op[2]}`;
    else if(op[0]==='C')d+=`C${op[1]} ${op[2]} ${op[3]} ${op[4]} ${op[5]} ${op[6]}`;
    else if(op[0]==='Q')d+=`Q${op[1]} ${op[2]} ${op[3]} ${op[4]}`;else if(op[0]==='Z')d+='Z';
  }return d;
}

function render(){
  const out=document.getElementById('output');
  for(const[key,label]of Object.entries(GLYPH_LABELS)){
    const data=GLYPH_DATA[key];if(!data)continue;
    const section=document.createElement('div');section.className='glyph-section';
    section.innerHTML=`<h2>${label}</h2>`;
    const row=document.createElement('div');row.className='row';
    const contours=parseContours(data.italic);
    let minX=9999,minY=9999,maxX=-9999,maxY=-9999;
    for(const c of contours)for(const p of c){minX=Math.min(minX,p.x-50);minY=Math.min(minY,p.y-50);maxX=Math.max(maxX,p.x+50);maxY=Math.max(maxY,p.y+50)}
    const w=maxX-minX,h=maxY-minY;const scale=200/h;const svgW=Math.round(w*scale)+20;const svgH=220;
    const tx=10,ty=svgH-10+minY*scale;

    function makeSvg(pathD,color,lbl,extra){
      const cell=document.createElement('div');cell.className='cell';
      let ext=extra||'';
      cell.innerHTML=`<svg width="${svgW}" height="${svgH}"><g transform="translate(${tx},${ty}) scale(${scale.toFixed(4)},${-scale.toFixed(4)})">${ext}<path d="${pathD}" fill="${color}"/></g></svg><div class="label">${lbl}</div>`;
      return cell;
    }

    // Italic
    row.appendChild(makeSvg(opsToSvgPath(data.italic),'black','italic'));
    // Averaged
    row.appendChild(makeSvg(contoursToPath(contours.map(c=>emboldenContour(c,'averaged'))),'#c00','averaged'));
    // Miter
    row.appendChild(makeSvg(contoursToPath(contours.map(c=>emboldenContour(c,'miter'))),'#07a','miter'));
    // Adaptive
    const adapPath=contoursToPath(contours.map(c=>emboldenContour(c,'adaptive')));
    row.appendChild(makeSvg(adapPath,'#2a2','adaptive'));
    // Adaptive + simplify
    if(ADAPTIVE_SIMPLIFIED[key])row.appendChild(makeSvg(ADAPTIVE_SIMPLIFIED[key],'#c0c','adaptive+simplify'));
    // Inkscape edit (if available) — with italic outline overlay
    if(INKSCAPE_EDIT[key]){
      const italicPath=opsToSvgPath(data.italic);
      const sw=(1.2/scale).toFixed(2);
      row.appendChild(makeSvg(INKSCAPE_EDIT[key],'#f80','inkscape edit',
        `<path d="${italicPath}" fill="none" stroke="#00f" stroke-width="${sw}" opacity="0.5"/>`));
    }
    // Bold skewed
    let boldPath='';
    if(data.bold){boldPath=opsToSvgPath(skewPath(data.bold));row.appendChild(makeSvg(boldPath,'#999','bold skewed'))}
    // Overlay: adaptive + bold
    if(data.bold){
      const sw=(1.5/scale).toFixed(2);
      row.appendChild(makeSvg(adapPath,'rgba(34,170,34,0.5)','adaptive+bold',`<path d="${boldPath}" fill="none" stroke="#333" stroke-width="${sw}"/>`));
    }
    // Overlay: simplified + bold
    if(ADAPTIVE_SIMPLIFIED[key]&&data.bold){
      const sw=(1.5/scale).toFixed(2);
      row.appendChild(makeSvg(ADAPTIVE_SIMPLIFIED[key],'rgba(204,0,204,0.4)','simplified+bold',`<path d="${boldPath}" fill="none" stroke="#333" stroke-width="${sw}"/>`));
    }

    section.appendChild(row);out.appendChild(section);
  }
}
render();
</script>
